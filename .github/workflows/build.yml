# Testet den BdB-Butler und baut die App als deb-Paket für Ubuntu.
#
# - Bei jedem Push auf main und bei Pull Requests laufen nur die Tests.
# - Bauen: auf der Seite "Actions" den Workflow "Bauen" wählen und "Run workflow" drücken. Das deb-Paket liegt danach
#   unten auf der Seite des Laufs unter "Artifacts". Läuft der Bau auf main, landet das Paket außerdem in der
#   apt-Paketquelle (siehe unten).
# - Release: Ein Tag wie v0.1.0 pushen. Dann wird gebaut, die apt-Paketquelle aktualisiert und ein Release-Entwurf mit
#   dem deb-Paket und der Server-Datei angelegt, den du auf GitHub prüfst und veröffentlichst. Die Version im Tag
#   sollte zu "version" in app/src-tauri/tauri.conf.json passen. Das Installationsskript für Alpine lädt den Server aus
#   dem neuesten veröffentlichten Release (server/deploy/install-alpine.sh).
# - apt-Paketquelle: Der Job "apt" legt ein signiertes apt-Repository auf dem Branch gh-pages ab, den GitHub Pages
#   ausliefert (https://dennismarcbusch.github.io/bdb-butler/). Einmalig nötig: Secret APT_GPG_PRIVATE_KEY und
#   Pages-Quelle "gh-pages", siehe docs/INSTALLATION.md, Abschnitt 4.1.
# - Bis auf Weiteres gibt es nur deb-Pakete. Windows-Installer, rpm und AppImage sind abgeschaltet (das AppImage bringt
#   WebKitGTK mit und ist sehr groß). Windows wieder einschalten: in der Matrix des Jobs "build" den Eintrag
#   "Windows" (os: windows-latest) ergänzen, "--bundles deb" nur für Linux setzen und die Installer unter
#   target/release/bundle/nsis und msi wieder in den Artifacts aufführen.
name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ein neuer Push bricht nur ältere Testläufe ab, nie einen laufenden Bau.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync-Server testen
        working-directory: server
        run: go test -race ./...

      - name: Kern testen (mit Integrationstest gegen den Go-Server)
        run: cargo test -p bdb-core

      - name: Oberfläche testen
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

  build:
    name: App bauen (Ubuntu, deb)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Ubuntu 22.04: Das Paket läuft damit auch auf älteren Systemen (glibc), WebKitGTK 4.1 ist vorhanden.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Systembibliotheken für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-ubuntu-22.04

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: App bauen (nur deb)
        working-directory: app
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      # Tauri nennt das Paket "bd-b-butler" (trennt "BdB" an jedem Buchstabenwechsel). Das Skript macht "bdb-butler" daraus.
      - name: Paketnamen setzen
        run: sh app/deploy/rename-deb.sh target/release/bundle/deb/*.deb

      - name: Paket bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: BdB-Butler-Ubuntu
          if-no-files-found: error
          path: target/release/bundle/deb/*.deb

  apt:
    name: apt-Paketquelle aktualisieren
    needs: build
    # Nur Tags und manuelle Läufe auf main, damit kein Zwischenstand von einem anderen Branch in der Paketquelle landet.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      # Zwei Läufe dürfen nicht gleichzeitig auf gh-pages schreiben.
      group: apt-paketquelle
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: BdB-Butler-Ubuntu
          path: debs

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      - name: Bisherige Paketquelle holen
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" site
          else
            mkdir site
          fi

      - name: Paketquelle erzeugen und signieren
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: sh app/deploy/build-apt-repo.sh debs site

      - name: Auf gh-pages veröffentlichen
        run: |
          cd site
          # Ohne Verlauf: Die Pakete sind Binärdateien, ein Verlauf würde das Repository nur aufblähen.
          rm -rf .git
          git init --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "apt-Paketquelle für ${GITHUB_REF_NAME}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  server:
    name: Server bauen (Linux amd64 und arm64)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Bauen
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist-server
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o ../dist-server/bdbb-server-linux-$arch .
          done
          cd ../dist-server
          sha256sum bdbb-server-linux-* > SHA256SUMS-server.txt
          cat SHA256SUMS-server.txt

      - name: Server-Dateien bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: BdB-Butler-Server
          if-no-files-found: error
          path: dist-server/*

  release:
    name: Release-Entwurf anlegen
    needs: [build, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: BdB-Butler ${{ github.ref_name }}
          files: dist/*
          body: |
            Paket für Ubuntu und Debian (`.deb`). Einfacher zu installieren und zu aktualisieren ist die apt-Paketquelle (Abschnitt 4 der Anleitung).

            Sync-Server: `bdbb-server-linux-amd64` und `bdbb-server-linux-arm64` (statisch gebaut, Prüfsummen in `SHA256SUMS-server.txt`). Das Installationsskript für Alpine (`server/deploy/install-alpine.sh`) lädt sie aus dem neuesten veröffentlichten Release.

            Einrichtung: siehe [docs/INSTALLATION.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALLATION.md).
