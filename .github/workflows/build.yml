# Testet den BdB-Butler und baut die App für Windows und Ubuntu.
#
# - Bei jedem Push auf main und bei Pull Requests laufen nur die Tests.
# - Bauen: auf der Seite "Actions" den Workflow "Bauen" wählen und "Run workflow" drücken. Die Installer liegen danach
#   unten auf der Seite des Laufs unter "Artifacts".
# - Release: Ein Tag wie v0.1.0 pushen. Dann wird gebaut und ein Release-Entwurf mit allen Installern angelegt, den du
#   auf GitHub prüfst und veröffentlichst. Die Version im Tag sollte zu "version" in app/src-tauri/tauri.conf.json passen.
name: Bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Sync-Server testen
        working-directory: server
        run: go test -race ./...

      - name: Kern testen (mit Integrationstest gegen den Go-Server)
        run: cargo test -p bdb-core

      - name: Oberfläche testen
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

  build:
    name: App bauen (${{ matrix.name }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          # Ubuntu 22.04: Die Pakete laufen damit auch auf älteren Systemen (glibc), WebKitGTK 4.1 ist vorhanden.
          - name: Ubuntu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systembibliotheken für Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: App bauen
        working-directory: app
        run: |
          npm ci
          npm run tauri build

      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: BdB-Butler-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  release:
    name: Release-Entwurf anlegen
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: BdB-Butler ${{ github.ref_name }}
          files: dist/*
          body: |
            Installer für Windows (`.exe` oder `.msi`) und Linux (`.deb`, `.rpm`, `.AppImage`).

            Die Installer sind nicht signiert. Windows SmartScreen warnt deshalb beim ersten Start: „Weitere Informationen“, dann „Trotzdem ausführen“.

            Einrichtung: siehe [docs/INSTALLATION.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALLATION.md).
