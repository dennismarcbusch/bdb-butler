<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dienstreisebuster{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --fg:#1d2127; --muted:#667085; --card:#fff; --line:#d9dde3; --accent:#1f5fbf; --ok:#1b7f4b; --warn:#b54708; --err:#b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171c; --fg:#e8eaed; --muted:#9aa3af; --card:#1c2027; --line:#303640; --accent:#6ea2f5; --ok:#4cc38a; --warn:#f0a35e; --err:#f1897f; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { background:var(--card); border-bottom:1px solid var(--line); }
    header .in, main { max-width:960px; margin:0 auto; padding:0 16px; }
    header .in { display:flex; gap:16px; align-items:center; height:52px; }
    header a { color:var(--fg); text-decoration:none; }
    header .brand { font-weight:700; margin-right:auto; }
    main { padding-top:24px; padding-bottom:48px; }
    h1 { font-size:1.5rem; margin:0 0 16px; }
    h2 { font-size:1.15rem; margin:0 0 12px; }
    a { color:var(--accent); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
    .btn, button { display:inline-block; font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; text-decoration:none; }
    .btn.sec, button.sec { background:transparent; color:var(--accent); }
    button.danger { background:transparent; color:var(--err); border-color:var(--err); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:.85rem; border:1px solid var(--line); }
    .badge.beantragt, .badge.genehmigt { color:var(--warn); border-color:var(--warn); }
    .badge.abgerechnet { color:var(--accent); border-color:var(--accent); }
    .badge.bezahlt { color:var(--ok); border-color:var(--ok); }
    .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; border:1px solid var(--line); background:var(--card); }
    .msg.success { border-color:var(--ok); } .msg.error { border-color:var(--err); }
    form p, form .field { margin:0 0 12px; }
    label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:2px; }
    input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
      width:100%; font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:0 16px; }
    .helptext { color:var(--muted); font-size:.85rem; }
    .errorlist { color:var(--err); margin:0 0 4px; padding:0; list-style:none; }
    .check label { display:inline; color:var(--fg); } .check input { margin-right:6px; }
  </style>
</head>
<body>
  <header><div class="in">
    <a class="brand" href="{% url 'reisen:liste' %}">Dienstreisebuster</a>
    {% if user.is_authenticated %}
      <a href="{% url 'reisen:liste' %}">Reisen</a>
      <a href="{% url 'reisen:einstellungen' %}">Einstellungen</a>
      <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="sec" type="submit">Abmelden</button></form>
    {% endif %}
  </div></header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
